name: Refresh Lichess Statistics

on:
  # Runs as soon as the cards, the script or this workflow are committed.
  # Handy when you cannot run Python locally: pushing from the phone is enough.
  push:
    branches: [main]
    paths:
      - "**.md"
      - "tools/update_stats.py"
      - ".github/workflows/update-stats.yml"

  schedule:
    # Every Monday at 04:17 UTC. An odd minute avoids the top-of-hour rush
    # on the explorer, which rate limits aggressively.
    - cron: "17 4 * * 1"

  workflow_dispatch:
    inputs:
      paths:
        description: "Files or directories to refresh (default: whole repo)"
        default: "."
      force:
        description: "Ignore the cache and refetch everything"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: lichess-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Cached answers expire after 6 days inside the script itself, so the
      # weekly run still refetches; the cache only spares the API on reruns.
      - uses: actions/cache@v4
        with:
          path: .cache
          key: explorer-${{ github.run_id }}
          restore-keys: explorer-

      - name: Update statistics
        run: |
          python tools/update_stats.py ${{ inputs.paths || '.' }} \
            --delay 1.5 ${{ inputs.force && '--no-cache' || '' }}

      - name: Commit changes
        run: |
          if [ -z "$(git status --porcelain '*.md')" ]; then
            echo "Statistics unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.md'
          git commit -m "chore: refresh Lichess statistics"
          git push
